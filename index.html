<style>
  :root {
  --bg-main: #f4f5f2;
  --bg-card: #ffffff;
  --green-dark: #2f5d46;
  --green-mid: #5f8f73;
  --green-light: #e3ede6;
  --accent: #c9b458;
  --text-main: #1f2a24;
  --text-muted: #6b7c72;
}
html, body {
  height: 100%;
  margin: 0;
  box-sizing: border-box;
  width: 100%;
  overflow-x: hidden; /* optional, um horizontales Scrollen zu verhindern */
  touch-action: manipulation;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  margin: 0;
  width: 100%;
}

main.page {
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  justify-content: center;  /* zentriert quiz-config horizontal */
  width: 100%;               /* volle Breite */
}

button {
  background: var(--green-dark);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.2s ease;
}
button:hover { background: #0056b3; }
button:disabled { background: #6c757d; cursor: not-allowed; }

.status { margin-top: 10px; min-height: 24px; font-weight: bold;}

#quiz,
#quiz-config,
#quiz-summary {
  display: none;
}
/* ===============================
   Quiz Status
   =============================== */
#quiz-status {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
  color: var(--text-muted);
  font-weight: bold;
  font-size: 1.125rem; /* 18px */
  gap: 1rem;
}
#category-loading {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  margin: 0;
}
/* ===============================
   Kategorien-Buttons
   =============================== */

#category-section {
  flex: 1 1 auto; 
  display: flex;
  flex-direction: column;
  min-height: 0; /* wichtig, damit Flex-Kind wächst */
}

#category-buttons {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  /* jede Zeile passt sich der Höhe der Items an */
  grid-auto-rows: auto;         /* <– wichtig */
  gap: 0;
  margin: 0;
  padding: 0;
}

.category-button {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  width: 100%;
  /* KEINE feste Höhe hier */
  /* height: 100%;  entfernen */
  aspect-ratio: 3 / 2;          /* steuert jetzt wirklich das Seitenverhältnis */
}

.category-button::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  /* Verlauf: unten dunkler → nach oben transparent */
  background: linear-gradient(
    to top,
    rgba(0, 0, 0, 0.55) 0%,
    rgba(0, 0, 0, 0.25) 35%,
    rgba(0, 0, 0, 0) 100%
  );

  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 1;   /* über dem Bild … */
}
.category-button:hover::before {
  opacity: 1;
}
.category-button img {
  display: block;         /* entfernt kleine Lücken */
  width: 100%;
  height: 100%;
  object-fit: cover;      /* Bild füllt den Container komplett */
  transition: transform 0.5s ease;
  border-radius: 0;       /* kein Radius */
  transform: translateZ(0); /* subtile Rendering-Glättung */
}

.category-button:hover img {
  transform: scale(1.06); /* sanftes Zoomen bei Hover */
}

/* Label unten links */
.category-label {
  position: absolute;
  left: 20px;        /* Abstand vom linken Rand */
  bottom: 16px;      /* Abstand vom unteren Rand */
  padding: 4px 6px;
  color: #fff;
  pointer-events: none;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  width: auto;
  max-width: 90%;    /* passt sich der Grid-Zelle an */
  border-radius: 0;  /* kein Radius */
  box-sizing: border-box;
}

/* Titel innerhalb Label */
.category-label .cat_title {
  font-size: 18px;
  font-weight: 700;
}

/* Untertitel einblenden bei Hover */
.category-label .cat_untertitel {
 font-size: 12px;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 0.5s ease, max-height 0.5s ease;
}

.category-button:hover .cat_untertitel {
  opacity: 1;
  max-height: 40px;
}

/* Standard: Mobile/klein – alles untereinander wie gehabt */
#quiz-layout {
  display: block;
}



/* ===============================
   Quiz-Karte
   =============================== */
#quiz {
  --quiz-content-width: clamp(260px, 80vw, 700px);
  background: var(--bg-card);
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.08);
  width: 90%;
  margin: 0.5rem auto;
  padding:
    clamp(0.75rem, 2vh, 1.25rem)
    clamp(1rem, 3vw, 1.75rem);
  display: flex;
  flex-direction: column;
  position: relative;
  width: 100%;
  max-width: var(--quiz-content-width);
  margin-left: auto;
  margin-right: auto;
  padding-bottom: clamp(0.6rem, 0.5vh, 0.65rem);
  margin-top: 20px;
}


#quiz-status-wrapper {
  display: flex;
  justify-content: flex-start;  
  width: 100%;
  margin: 0 auto 10px;          
  gap: 1rem;                     
  color: var(--text-muted);
  font-weight: bold;
  flex-shrink: 1;
  line-height: 1.1;
  margin-bottom: 0.25rem;
  max-width: var(--quiz-content-width);
  margin-left: auto;
  margin-right: auto;

}

#quiz-status {
  display: flex;
  justify-content: flex-start;      
  width: 100%;           
  margin: 0 auto 5px;              
  gap: 1rem;
  color: var(--text-muted);
  font-weight: bold;
  box-sizing: border-box;   
  flex-shrink: 1;
  font-size: clamp(0.8rem, 1rem, 1.125rem);
  line-height: 1.1;
  margin-bottom: 0.25rem;        
  max-width: var(--quiz-content-width);
  margin-left: auto;
  margin-right: auto;

}
#status{
  display: none;
  position: absolute;
  z-index: 0;
}

#image-wrapper-container { 
  display: inline-block; 
  position: relative;
  width: auto;
  margin-bottom: 0;
}

#image-wrapper {
  aspect-ratio: 3 / 2;
  width: 100%;
  overflow: hidden;
  position: relative;
  margin: 0 0 0;
  border-radius: 5px;
  cursor: pointer;
  position: relative;
  flex: 1 1 auto;
  max-height: 100%;
  min-height: 100%;
  max-width: var(--quiz-content-width);
  margin-left: auto;
  margin-right: auto;
}

img { 
  border-radius: 5px;
}

#image-toggle-hint {
  position: absolute;
  bottom: 100%;
  right: 4px;
  margin-bottom: 2px;
  color: black;
  font-size: 0.75rem;
  padding: 1px 5px;
  pointer-events: none;
  white-space: nowrap;
}

#species-image.preview { 
  width: 100%; 
  height: auto; 
  object-fit: cover; 
  transform: none !important; 
}

#species-image.detail { 
  width: auto; 
  height: auto;
  object-fit: unset; 
}


input[type="text"] {
  width: 80%;
  border: 2px solid #dde3dd;
  background: #fff;
  color: var(--text-main);
  max-width: var(--quiz-content-width);
  margin-left: auto;
  margin-right: auto;
  font-size: clamp(0.85rem, 2.1vh, 1.125rem);
  padding: clamp(0.45rem, 1.8vh, 0.875rem)
           clamp(0.65rem, 2.5vh, 1.125rem);

  border-radius: clamp(0.5rem, 1.5vh, 0.875rem);
}

#question-area{
  margin-top: 4%;
}

#answer-container {
  min-height: 0;
  flex-shrink: 1;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-top: 3%;
}

#answer-container .revealed-answer {
  font-size: 1.25rem;
  font-weight: 500;
  color: var(--green-mid);
  text-align: center;
  display: inline-block;
}

.mc-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  width: 100%;
  flex-shrink: 1;
  gap: clamp(0.4rem, 1.5vh, 1rem);
  margin-top: clamp(0.4rem, 1.2vh, 1.25rem);
  max-width: var(--quiz-content-width);
  margin-left: auto;
  margin-right: auto;

}

.mc-option {
  border-radius: 14px;
  background: #fff;
  border: 2px solid #dde3dd;
  cursor: pointer;
  text-align: center;
  width: 100%;
  padding: clamp(0.5rem, 3.5vh, 5rem) 0;
}


.mc-option:not(.disabled):hover {
  border-color: var(--green-dark);
  background-color: var(--green-light);
  color: var(--text-main);
}

.mc-scientific {
  display: block;
  font-style: italic;
  font-size: 14px;
  margin-top: 5px;
  color: inherit; 
}


.mc-option.correct {
  background: var(--green-dark);
  border-color: var(--green-dark);
  color: white;
}
.mc-option.correct .mc-trivial,
.mc-option.correct .mc-scientific {
  color: #ffffff;
}

.mc-option.wrong {
  background: #c41425;
  border-color: #c41425;
  color: white;
}
.mc-option.wrong .mc-trivial,
.mc-option.wrong .mc-scientific {
  color: #ffffff;
}

.mc-trivial { 
  font-size: clamp(0.8rem, 1rem, 1.5rem);
  font-weight: 400;
  line-height: 1.15;
}

.mc-scientific { 
  font-style: italic; 
  font-size: clamp(0.7rem, 0.8rem, 1.1rem);
  line-height: 1.1;
  color: var(--text-muted); 
}

.mc-option.correct { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
.mc-option.correct .mc-trivial, .mc-option.correct .mc-scientific { color: #fff; }
.mc-option.wrong { background: #c41425; border-color: #c41425; color: #fff; }
.mc-option.wrong .mc-trivial, .mc-option.wrong .mc-scientific { color: #fff; }

.mc-option.disabled { 
  pointer-events: none; 
  opacity: 1; 
}


#button-container {
  margin-top: auto;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: clamp(0.4rem, 1.2vh, 0.625rem);
  flex-shrink: 0;
  padding-bottom: 0;
  padding-top: clamp(0.4rem, 1.2vh, 0.8rem);
  margin-bottom: 0;
}

#button-container button {
  font-size: clamp(0.85rem, 2.1vh, 1.125rem);
  padding: clamp(0.45rem, 1.8vh, 0.95rem)
           clamp(0.9rem, 3vh, 1.75rem);
  border-radius: clamp(0.5rem, 1.4vh, 0.75rem);
}

#reveal-button {
  background: var(--green-mid);
  color: #fff;
}

#next-button {
  background: var(--green-mid);
  color: #fff;
  margin-bottom: 0;
}


#quiz-wrapper {
  display: flex;
  flex-direction: column;
  align-items: flex-start; 
  margin-top: 0;        
}

#abort-button {
  display: none;               
  position: absolute;          
  top: 100px;                   
  left: 20px;                  
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  background: #c41425;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#photo-meta, #photo-id, #photo-credit {
  font-size: 0.75rem;
  padding: 4px 8px;
  border-radius: 8px;
}

/* Container linksbündig */
#meta-wrapper {
  margin-top: 0.35rem;
  padding-right: 2%;
}
#meta-buttons {
  text-align: right;
}

#question-header {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
/* Button ohne Hintergrund, wie ein Link */
#license-toggle {
  padding: 0;
  margin: 0;
  border: none;
  background: none;         /* Link-Farbe nach Geschmack */
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 500;
  color: #111;
}
#question-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: baseline;
  width: 100%;
}
#features-toggle {
  grid-column: 3;
  justify-self: center;
  margin: 0;
  padding: 0;
  border: none;
  background: none;
  line-height: 1.2;
}
#quizfrage {
  grid-column: 2;
  justify-self: center;
  margin: 0;
  text-align: center;
  font-size: 1.4rem;
  font-weight: 500;
}
#features-toggle img {
  display: block;
  width: 20px;   /* anpassen */
  height: 20px;  /* anpassen */
  object-fit: contain;
}
.features-intro {
  grid-column: 1 / -1;
  font-size: 0.8rem;
  line-height: 1.4;
  margin-bottom: 0.25rem;
  text-align: left;
  display: none;
}

#features-text {
  width: 100%;
  text-align: left;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.5rem 0.5rem;
  margin-bottom: 0;
  font-size: 0.75rem;
}

#features-text.is-open {
  display: grid;
}

.feature-entry {
  min-width: 0;
  border: var(--green-mid);
  padding: 3px;
}

.feature-name,
.feature-tip {
  overflow-wrap: anywhere;
  word-break: break-word;
}




/* Hover/Focus für bessere Usability */
#license-toggle:hover,
#license-toggle:focus,
#features-toggle:hover,
#features-toggle:focus {
  text-decoration: none;
}

/* Lizenztext linksbündig, dezent hinterlegt (oder Hintergrund entfernen) */
#license-text {
  padding: 0;
  font-size: 0.85rem;
  background: none;     /* falls du gar keinen Hintergrund willst: background: none; */
  border-radius: 4px;
  margin-top: 0.25rem;
  text-align: right;
}



.page {
  width: 100%;
  margin: 0;
  padding: 0;
  text-align: center;
}



/* --- Obere Menüleiste --- */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg-card);
  border-bottom: 1px solid #dde3dd;
  flex-shrink: 0;
}

.top-nav-inner {
  max-width: 100%;
  margin: 0 auto;
  padding: 0.05% 10%;
  display: flex;
  align-items: baseline;
  gap: 54px;
  position: relative;
}

.nav-primary {
  color: var(--green-dark);
  text-decoration: none;
  font-family: "Cairo", sans-serif;
  font-optical-sizing: auto;
  font-weight: 800;
  font-style: normal;
  font-variation-settings:
    "slnt" 0;
  font-size: 28px;
}

.nav-secondary {
  text-decoration: none;
  color: var(--text-muted);
  font-size: 14px;
}

.nav-secondary:hover {
  color: var(--green-dark);
}
.language {
  position: absolute;
  top: 8%;
  right: 5%;           /* passend zu deinem padding */
}
h1 {
  font-size: 36px;
  margin-bottom: 10px;
}
.slider-container {
  width: 50%;
  margin: 40px auto;
  text-align: center;
}
.config-category-select{
  font-size: 20px;
}
.custom-slider {
  display: flex;
  position: relative;
  height: 40px;
  background: #eee;
  border-radius: 8px;
  user-select: none;
}

.slider-track {
  display: flex;
  width: 100%;
  height: 100%;
  background: #eee;
  border-radius: 8px;
  position: relative;
}

.slider-option {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  z-index: 1;
  font-weight: 600;
}

.slider-thumb {
  position: absolute;
  top: 0;
  width: 25%; /* 4 Optionen */
  height: 100%;
  background: #5f8f73;
  border-radius: 8px;
  transition: left 0.2s;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-weight: bold;
  pointer-events: none; /* damit Klicks auf Optionen gehen */
}

.slider-value {
  margin-top: 5px;
  font-weight: bold;
}
.slider-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 10px;
}

.slider-buttons button {
  padding: 15px 30px;
  border: none;
  border-radius: 8px;
  background: #d6d6d6;      /* dunkleres Grau */
  color: #1f2a24;           /* dunkle Schrift */
  cursor: pointer;
  font-weight: 600;
  font-size: 20px;
  transition: background 0.2s, color 0.2s;
}

.slider-buttons button.active {
  background: #5f8f73;      /* Grün wie vorher */
  color: white;
}
#start-quiz-btn {
  font-size: 25px;
  padding: 20px 40px;
}
#back-to-categories {
  position: fixed;
  top: 75px;
  left: 20px;
  background: #c41425;
  color: white;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  margin: 0;
}

#quiz-config {
  display: none;
  position: relative; /* nötig für absolute Positionierung des Back-Buttons */
  background: var(--bg-main);
  border-radius: 12px;
  width: 100%;           /* nimmt Containerbreite */
  flex-direction: column;
  align-items: center;   /* Inhalte horizontal zentrieren */
  padding: 2rem;
  margin: 0;
}
.config-category-title {
  font-size: 38px;      /* größer */
  margin: 30px 0 18px;  /* etwas Abstand */
  color: var(--green-dark);
}
.config-category-subtitle{
  font-size: 1.7rem;
  font-weight: 400;
}

.slider-container {
  width: 100%;
  max-width: 500px;
}

#category-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
  min-height: calc(100vh - var(--nav-height) - var(--footer-height));
}


#category-section p {
  color: var(--text-muted);
  margin-bottom: 0px;
}
#start-quiz-btn {
  display: block;      /* Block-Level für margin auto */
  margin: 40px auto 0; /* oben Abstand, horizontal zentriert */
  font-size: 25px;
  padding: 20px 40px;
  background: var(--green-dark);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 8vh;
}

.quiz-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3000;
}

#species-image {
  width: 100%;
  height: auto;
  aspect-ratio: 3 / 2;         /* 3:2 Verhältnis */
  object-fit: contain;         /* ganzes Bild sichtbar, wie bisher */

  z-index: 1;
  position: relative;
}
#audio-wrapper {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0.3rem 0.5rem;
  background: rgba(255, 255, 255, 0.9);

  padding-bottom: 5%;
  padding-top: 3%;
  z-index: 2;
}

#audio-wrapper audio {
  width: 80%;
  transform: scale(1.2);
}

#quiz-summary {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: none;               /* wichtig */

  justify-content: center;
  z-index: 3000;
}
.quiz-summary-card {
  background: var(--bg-main);
  padding: 48px 40px;
  border-radius: 16px;
  max-width: 520px;
  width: 90%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);

  display: flex;
  flex-direction: column;
  gap: 28px;              /* 🔹 Hauptabstand */
}
.quiz-summary-card h2 {
  margin: 0;
  font-size: 28px;
  font-weight: 700;
}
.summary-item {
  display: flex;
  justify-content: flex-start;
  font-size: 18px;
}
.summary-quote {
  text-align: center;
  font-style: italic;
  margin: 10px 0 20px;
  font-size: 1rem;
  color: #5f8f73;
}

#photo-id {
  position: absolute;
  bottom: 8px;
  left: 8px;
  font-size: 12px;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
}

#photo-credit {
  position: absolute;
  bottom: 8px;
  right: 8px;
  font-size: 12px;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
}
#photo-id,
#photo-credit {
  z-index: 3;
}

footer {
  background: var(--bg-card);
  border-top: 1px solid #dde3dd;
  text-align: center;
  padding: 16px 0;

function getDistractors(correctItem, allItems) {
  const phy = Array.isArray(correctItem.phylogeny) ? correctItem.phylogeny : [];
  const correctSpecies = correctItem.scientific_name;

  const candidates = new Map();
  const uniquePush = (item) => {
    if (!item) return;
    if (item.scientific_name === correctSpecies) return;
    if (!candidates.has(item.scientific_name)) {
      candidates.set(item.scientific_name, item);
    }
  };

  // Items mit Tag holen und auf verschiedene Arten reduzieren
  const distinctSpeciesWithTag = (tag) => {
    if (!tag) return [];
    const seen = new Set();
    const result = [];
    for (const it of allItems) {
      if (!Array.isArray(it.phylogeny)) continue;
      if (!it.phylogeny.includes(tag)) continue;
      if (it.scientific_name === correctSpecies) continue;
      if (seen.has(it.scientific_name)) continue;
      seen.add(it.scientific_name);
      result.push(it);
    }
    return result;
  };

  const last = phy.length - 1;
  const genusTag   = phy[last];       // Gattung (z.B. Vanessa)
  const tribeTag   = phy[last - 1];   // Nymphalini
  const familyTag  = phy[last - 2];   // Nymphalidae

  const genus   = distinctSpeciesWithTag(genusTag);
  const tribe   = distinctSpeciesWithTag(tribeTag);
  const family  = distinctSpeciesWithTag(familyTag);

  // 1) Nur Gattung, wenn es ≥ 3 verschiedene Arten gibt
  if (genus.length >= 3) {
    shuffle(genus).slice(0, 3).forEach(uniquePush);
  } else if (genus.length > 0 || tribe.length > 0) {
    // 2) Gattung + Tribus
    shuffle(genus).forEach(uniquePush);
    let remaining = 3 - candidates.size;
    if (remaining > 0) {
      shuffle(tribe.filter(it => !candidates.has(it.scientific_name)))
        .slice(0, remaining)
        .forEach(uniquePush);
    }
    // 3) Falls dann immer noch < 3: Familie ergänzen
    remaining = 3 - candidates.size;
    if (remaining > 0) {
      shuffle(family.filter(it => !candidates.has(it.scientific_name)))
        .slice(0, remaining)
        .forEach(uniquePush);
    }
  } else {
    // 4) Falls gar keine Gattungs/Tribus-Infos nutzbar: nur Familie
    if (family.length >= 3) {
      shuffle(family).slice(0, 3).forEach(uniquePush);
    }
  }

  // 5) Fallback: gleiche Kategorie
  if (candidates.size < 3) {
    let remaining = 3 - candidates.size;
    shuffle(
      distinctSpeciesWithTag(null) // gleich ersetzen s.u. oder andere Logik
    );
  }

  // Besser: Kategorie-Fallback auch distinct pro Art:
  if (candidates.size < 3) {
    const remaining = 3 - candidates.size;
    const seen = new Set(candidates.keys());
    const sameCatDistinct = [];
    for (const it of allItems) {
      if (it.scientific_name === correctSpecies) continue;
      if (it.category !== correctItem.category) continue;
      if (seen.has(it.scientific_name)) continue;
      seen.add(it.scientific_name);
      sameCatDistinct.push(it);
    }
    shuffle(sameCatDistinct)
      .slice(0, remaining)
      .forEach(uniquePush);
  }

  // 6) letzter Fallback: völlig beliebige Arten, ebenfalls distinct
  if (candidates.size < 3) {
    const remaining = 3 - candidates.size;
    const seen = new Set(candidates.keys());
    const distinct = [];
    for (const it of allItems) {
      if (it.scientific_name === correctSpecies) continue;
      if (seen.has(it.scientific_name)) continue;
      seen.add(it.scientific_name);
      distinct.push(it);
    }
    shuffle(distinct).slice(0, remaining).forEach(uniquePush);
  }

  return shuffle(Array.from(candidates.values())).slice(0, 3);
}

function checkAnswer() {
  if (!currentItem || !answerInputEl) return;

  const val = answerInputEl.value.trim();
  if (!val) return;

  const normInput = normalize(val);
  const normSci = normalize(currentItem.scientific_name);
  const trivialNames = Array.isArray(currentItem.trivialname)
    ? currentItem.trivialname.map(n => normalize(n))
    : [];

  // Early return, wenn Eingabe noch zu kurz
  if (normInput.length < normSci.length && !trivialNames.some(tn => normInput.length >= tn.length)) return;

  const tolerantMatch = (input, target) =>
    input.length >= target.length && (input === target || levenshtein(input, target) <= 1);

  const okSci = tolerantMatch(normInput, normSci);
  const okTriv = trivialNames.some(tn => tolerantMatch(normInput, tn));

  if (okSci || okTriv) {
  answerInputEl.disabled = true;
  correctCount++;
  answeredCount++;
  updateQuizStatus();
  console.log(">>> before deciding next", {
  answeredCount,
  correctCount,
  totalShown,
  shownCount,
  photoIndex,
  hasNextItem: !!nextItem
});

  setTimeout(() => {

    answeredCount,
    quizLength,
    from: "checkAnswer"

    if (answeredCount >= quizLength) {
      console.log("CALL endQuiz FROM checkAnswer");

  endQuiz();
} else {
  console.log("CALL loadNextImage FROM checkAnswer");

  loadNextImage();
}
  }, 300);
  }
}

const MOBILE_MAX_WIDTH = 900;

// ---------- DESKTOP: Inline-Detailbild ----------
imageEl.addEventListener("click", async (e) => {
  if (window.innerWidth <= MOBILE_MAX_WIDTH) return;

  e.stopPropagation();
  if (!currentItem) return;

  const wrapper = document.getElementById("image-wrapper");
  const rect = wrapper.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  // 🔙 Zurück zur Vorschau
  if (showingDetail) {
    showingDetail = false;
    imageEl.className = "preview";
    imageEl.style.width = "";
    imageEl.style.height = "";
    imageEl.style.transform = "translate(0,0)";
    imageEl.style.objectFit = "";
    await setImageAndWait(imageEl, currentItem.url_vorschau);
    imageEl.style.visibility = "visible";
    setTimeout(focusAnswer, 0);
    return;
  }

  // 🔍 Detail anzeigen
  const detailUrl = await loadDetailImage(currentItem.url_detail);
  if (!detailUrl) return;

  showingDetail = true;
  imageEl.className = "detail";
  imageEl.style.visibility = "hidden";
  await setImageAndWait(imageEl, detailUrl);

  const imgW = imageEl.naturalWidth * SCALE;
  const imgH = imageEl.naturalHeight * SCALE;

  imageEl.style.width = imgW + "px";
  imageEl.style.height = imgH + "px";
  imageEl.style.objectFit = "unset";

  const relX = mouseX / rect.width;
  const relY = mouseY / rect.height;

  const tx = Math.min(0, Math.max(rect.width - imgW, -relX * (imgW - rect.width)));
  const ty = Math.min(0, Math.max(rect.height - imgH, -relY * (imgH - rect.height)));

  imageEl.style.transform = `translate(${tx}px, ${ty}px)`;
  imageEl.style.visibility = "visible";
  setTimeout(focusAnswer, 0);
});

// Mousemove nur auf Desktop
document.getElementById("image-wrapper").addEventListener("mousemove", (e) => {
  if (!showingDetail || window.innerWidth <= MOBILE_MAX_WIDTH) return;

  const rect = e.currentTarget.getBoundingClientRect();
  const imgW = imageEl.offsetWidth;
  const imgH = imageEl.offsetHeight;

  const relX = (e.clientX - rect.left) / rect.width;
  const relY = (e.clientY - rect.top) / rect.height;

  const x = Math.min(0, Math.max(rect.width - imgW, -relX * (imgW - rect.width)));
  const y = Math.min(0, Math.max(rect.height - imgH, -relY * (imgH - rect.height)));

  imageEl.style.transform = `translate(${x}px, ${y}px)`;
});


// ---------- MOBILE: Overlay mit Pointer Events ----------

// Zustände
let overlayJustClosed = false;
let overlayScale = 1;
let overlayPosX = 0;
let overlayPosY = 0;

// Pan / Pinch Startzustände
let panStartPosX = 0;
let panStartPosY = 0;
let panStartPointerX = 0;
let panStartPointerY = 0;

let pinchStartDist = 0;
let pinchStartScale = 1;
let pinchStartMidX = 0;
let pinchStartMidY = 0;
let pinchStartPosX = 0;
let pinchStartPosY = 0;


const activePointers = new Map(); // pointerId -> { x, y }

function closeOverlay() {
  overlay.style.display = 'none';
  detailImg.src = '';
  overlayOpening = false;
  overlayJustClosed = true;
  setTimeout(() => overlayJustClosed = false, 300);
}


function updateOverlayTransform() {
  const imgW = detailImg.naturalWidth * overlayScale;
  const imgH = detailImg.naturalHeight * overlayScale;
  const vw = overlay.clientWidth;
  const vh = overlay.clientHeight;

  // Wenn noch nichts geladen/gerendert ist: nichts machen
  if (!imgW || !imgH || !vw || !vh || !isFinite(imgW) || !isFinite(imgH)) {
    return;
  }

  // erlaubte Offsets, damit der Rand komplett sichtbar sein kann
  const maxOffsetX = Math.max(0, (imgW - vw) / 2);
  const maxOffsetY = Math.max(0, (imgH - vh) / 2);

  if (maxOffsetX === 0) overlayPosX = 0;
  else overlayPosX = Math.max(-maxOffsetX, Math.min(maxOffsetX, overlayPosX));

  if (maxOffsetY === 0) overlayPosY = 0;
  else overlayPosY = Math.max(-maxOffsetY, Math.min(maxOffsetY, overlayPosY));

  detailImg.style.transform =
    `translate(${overlayPosX}px, ${overlayPosY}px) scale(${overlayScale})`;
}

let overlayOpening = false;

  overlayPosX = 0;
  overlayPosY = 0;
  pinchStartDist = 0;   // falls du hier so heißt
  activePointers.clear();

  detailImg.onload = () => {
    updateOverlayTransform();
    overlayOpening = false;
  };
}, true);

// ---------- Pointer Events auf dem Detailbild ----------

// Pointer down
overlay.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch') return;

  overlay.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  const pointers = Array.from(activePointers.values());

  if (pointers.length === 2) {
    const [p1, p2] = pointers;
    pinchStartMidX = (p1.x + p2.x) / 2;
    pinchStartMidY = (p1.y + p2.y) / 2;

    pinchStartDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    pinchStartScale = overlayScale;
    pinchStartPosX = overlayPosX;
    pinchStartPosY = overlayPosY;
  } else if (pointers.length === 1) {
    const p = pointers[0];
    panStartPosX = overlayPosX;
    panStartPosY = overlayPosY;
    panStartPointerX = p.x;
    panStartPointerY = p.y;
  }
}, { passive: false });

overlay.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'touch') return;
  if (!activePointers.has(e.pointerId)) return;

  e.preventDefault();
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  const pointers = Array.from(activePointers.values());

  if (pointers.length === 2 && pinchStartDist > 0) {
    const [p1, p2] = pointers;

    const currentDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    let newScale = pinchStartScale * (currentDist / pinchStartDist);
    newScale = Math.max(1, Math.min(newScale, 4));

    const midX = (p1.x + p2.x) / 2;
    const midY = (p1.y + p2.y) / 2;
    const scaleFactor = newScale / pinchStartScale;

    overlayPosX = pinchStartPosX + (pinchStartMidX - midX) * (1 - scaleFactor);
    overlayPosY = pinchStartPosY + (pinchStartMidY - midY) * (1 - scaleFactor);

    overlayScale = newScale;
  } else if (pointers.length === 1) {
    const p = pointers[0];
    const dx = p.x - panStartPointerX;
    const dy = p.y - panStartPointerY;
    overlayPosX = panStartPosX + dx;
    overlayPosY = panStartPosY + dy;
  }

  updateOverlayTransform();
}, { passive: false });

function handlePointerUp(e) {
  if (e.pointerType !== 'touch') return;

  activePointers.delete(e.pointerId);
  const pointers = Array.from(activePointers.values());

  if (pointers.length === 1) {
    const p = pointers[0];
    panStartPosX = overlayPosX;
    panStartPosY = overlayPosY;
    panStartPointerX = p.x;
    panStartPointerY = p.y;
    pinchStartDist = 0;
    return;
  }

  if (pointers.length === 0) {
    detailImg.style.transition = 'transform 0.3s ease-out';
    setTimeout(() => {
      overlayPosX = 0;
      overlayPosY = 0;
      overlayScale = 1;
      updateOverlayTransform();
      setTimeout(() => { detailImg.style.transition = ''; }, 300);
    }, 50);
  }
}

overlay.addEventListener('pointerup', handlePointerUp, { passive: false });
overlay.addEventListener('pointercancel', handlePointerUp, { passive: false });

async function loadCategories() {
  categoryButtonsEl.innerHTML = "";
  categoryLoadingEl.textContent = "Lade Kategorien...";

  const { data, error } = await client
    .from("fq_metadata")
    .select("category, url_vorschau, cat_untertitel")
    .eq("filetype", "image")
    .eq("titelbild", "ja");

console.log("categories data", { error, count: data?.length, sample: data?.[0] });

  if (error || !data) {
    categoryLoadingEl.textContent = "Fehler beim Laden";
    return;
  }

  // R2-URLs bauen
  const rows = data.map(row => ({
    ...row,
    url_vorschau: `${R2_BASE_URL_VORSCHAU}/${row.url_vorschau}`
  }));

  const CATEGORY_ORDER = [
    "Säugetiere",
    "Reptilien",
    "Amphibien",
    "Libellen",
    "Heuschrecken",
    "Tagfalter",
    "Nachtfalter",
    "Käfer",
    "Zweiflügler",
    "Spinnentiere",
    "Sonstige Insekten",
    "Artenmix"
  ];

  // Kategorien extrahieren (→ rows statt data)
  const uniqueCategories = [...new Set(rows.map(d => d.category))];

  if (!uniqueCategories.includes("Artenmix")) {
    uniqueCategories.unshift("Artenmix");
  }

  uniqueCategories.sort((a, b) => {
    const ia = CATEGORY_ORDER.indexOf(a);
    const ib = CATEGORY_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b, "de");
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  uniqueCategories.forEach(cat => {
    if (cat === "Artenmix") {
      const btn = document.createElement("div");
      btn.className = "category-button";
      btn.onclick = () => onCategoryClick(cat);

      const img = document.createElement("img");
      img.src = `${R2_BASE_URL_VORSCHAU}/fqvorschau/Icons/Alle_Arten.webp`;
      img.alt = "Artenmix";

      const label = document.createElement("div");
      label.className = "category-label";
      label.innerHTML = `
        <div class="cat_title">Artenmix</div>
        <div class="cat_untertitel">Bestimme Arten aus verschiedenen Tiergruppen</div>
      `;

      btn.appendChild(img);
      btn.appendChild(label);
      categoryButtonsEl.appendChild(btn);
      return;
    }

    // → rows statt data
    const images = rows.filter(d => d.category === cat);
    const catImage =
      images[Math.floor(Math.random() * images.length)]?.url_vorschau || "";

    const btn = document.createElement("div");
    btn.className = "category-button";
    btn.onclick = () => onCategoryClick(cat);

    const img = document.createElement("img");
    img.src = catImage;
    img.alt = cat;

    const label = document.createElement("div");
    label.className = "category-label";
    label.innerHTML = `
      <div class="cat_title">${cat}</div>
      <div class="cat_untertitel">${images[0]?.cat_untertitel || ""}</div>
    `;

    btn.appendChild(img);
    btn.appendChild(label);
    categoryButtonsEl.appendChild(btn);
  });

  categoryLoadingEl.textContent = "";
}

function showQuizConfig(category) {
  selectedCategory = category;
  document.getElementById("config-category-title").textContent = `${category}`;

  categorySectionEl.style.display = "none";
  quizConfigEl.style.display = "block";

  const cfg = CATEGORY_CONFIG[category] || CATEGORY_CONFIG._default;

  // Antwortmodus: immer gleich, nur Default setzen
  selectedAnswerMode = "mc";
  document.querySelectorAll("#answer-mode-buttons button").forEach(b =>
    b.classList.toggle("active", b.dataset.value === selectedAnswerMode)
  );

  // Anzahl-Fotos: Buttons je nach Kategorie ein-/ausblenden + Default
  selectedNumPhotos = cfg.defaultNumPhotos;
  document.querySelectorAll("#num-photos-buttons button").forEach(b => {
    const value = b.dataset.value;
    const enabled = cfg.allowedNumPhotos.includes(value);
    b.style.display = enabled ? "inline-flex" : "none";
    b.classList.toggle("active", enabled && value === selectedNumPhotos);
  });

  // NEU: Dateityp-Block ein-/ausblenden
  const filetypeContainer = document.getElementById("filetype-container");
  const filetypeButtons   = document.querySelectorAll("#filetype-buttons button");
  const allowedFiletypes  = cfg.allowedFiletypes || ["image", "audio", "all"];

  if (allowedFiletypes.length === 1 && allowedFiletypes[0] === "image") {
    // Nur Bilder erlaubt -> Block komplett ausblenden
    filetypeContainer.style.display = "none";
    selectedFiletype = "image";
  } else {
    // Block anzeigen und Buttons passend konfigurieren
    filetypeContainer.style.display = "block";
    selectedFiletype = cfg.defaultFiletype || "image";

    filetypeButtons.forEach(b => {
      const value = b.dataset.value;  // "image" | "audio" | "all"
      const enabled = allowedFiletypes.includes(value);
      b.style.display = enabled ? "inline-flex" : "none";
      b.classList.toggle("active", enabled && value === selectedFiletype);
    });
  }

  // Schwierigkeit: Buttons ein-/ausblenden + Default
  selectedDifficulty = cfg.defaultDifficulty;
  document.querySelectorAll("#difficulty-buttons button").forEach(b => {
    const value = b.dataset.value;
    const enabled = cfg.allowedDifficulties.includes(value);

async function fetchAllImages(baseQuery) {
  const PAGE_SIZE = 1000; // nach Bedarf 500, 1000, 2000 ...
  let all = [];
  let from = 0;
  let to = PAGE_SIZE - 1;

  while (true) {
    const { data, error } = await baseQuery.range(from, to);
    if (error) {
      console.error('Fehler bei Supabase-Range:', error);
      throw error;
    }
    if (!data || data.length === 0) break;

    all = all.concat(data);

    if (data.length < PAGE_SIZE) break; // letzte Seite erreicht
    from += PAGE_SIZE;
    to += PAGE_SIZE;
  }

  return all;
}

startQuizBtn.onclick = async () => {
  audioPlayCountInRound = 0;
  currentCategory = selectedCategory;
  const numPhotos = selectedNumPhotos;
  const difficulty = selectedDifficulty;

  hideQuizConfig();
  categorySectionEl.style.display = "none";
  hideQuizSummary();

  // Difficulty
  let difficultyParam = null;
  if (difficulty !== "all") {
    difficultyParam = parseInt(difficulty, 10);
  }

  // filetype
  let filetypeParam = null;
  if (selectedFiletype === "image") {
    filetypeParam = "image";
  } else if (selectedFiletype === "audio") {
    filetypeParam = "audio";
  }

  // gewünschte Anzahl Datensätze aus DB
  const desired =
    numPhotos === "all" ? 100 : parseInt(numPhotos, 10);

  // Medien holen
  const { data, error } = await client.rpc('get_random_quiz_images_r2', {
    p_category:   selectedCategory,
    p_difficulty: difficultyParam,
    p_limit:      desired,
    p_filetype:   filetypeParam
  });

  console.log("first item", data?.[0]);

  if (error || !data || data.length === 0) {
    console.error(error);
    alert('Keine Medien für diese Auswahl gefunden.');
    return;
  }

  // Items vorbereiten
  const items = data.map(row => {
    const isAudio = row.filetype === "audio";
    return {
      ...row,
      url_vorschau: `${isAudio ? R2_BASE_URL_AUDIO : R2_BASE_URL_VORSCHAU}/${row.url_vorschau}`,
      url_detail: row.url_detail || null
    };
  });

  let filteredImages = shuffle(items);

  // Quiz-Variablen initialisieren
  imageQueue   = filteredImages;
  currentIndex = 0;
  correctCount = 0;
  answeredCount = 0;     // <– wichtig
  shownCount   = 0;
  totalShown   = 0;
  shownPhotos  = new Set();
  speciesMap   = {};
  speciesOrder = [];
  speciesPointer = 0;

  // Artenmap vorbereiten
  for (const item of imageQueue) {
    const art = item.scientific_name;
    if (!speciesMap[art]) speciesMap[art] = { photos: [], shownPointer: 0 };
    speciesMap[art].photos.push(item);
  }

  for (const art in speciesMap) {
    speciesMap[art].photos = shuffle(speciesMap[art].photos);
  }

  const MAX_PHOTOS_PER_SPECIES = 15;
  photoPool = [];

  for (const art in speciesMap) {
    const photos  = speciesMap[art].photos;
    const limited = shuffle(photos).slice(0, MAX_PHOTOS_PER_SPECIES);
    photoPool.push(...limited);
  }

  shuffledPhotos = shuffle(photoPool);
  photoIndex = 0;

  // quizLength jetzt aus numPhotos bestimmen
  quizLength = (numPhotos === "all")
    ? shuffledPhotos.length
    : Math.min(parseInt(numPhotos, 10), shuffledPhotos.length);

  // passend begrenzen
  shuffledPhotos = shuffledPhotos.slice(0, quizLength);

  console.log("quizLength =", quizLength, "photos =", shuffledPhotos.length);

  updateQuizStatus();
  document.getElementById("quiz-status").style.display = "flex";
  document.getElementById("abort-button").style.display = "block";
  quizEl.style.display = "block";

  startTimer();

  // erste Frage vorladen und anzeigen
  await preloadNextQuestion();
  await loadNextImage();
};

// --- Timer Funktionen ---
function startTimer() {
  quizStartTime = Date.now();
}

function stopTimer() {
  clearInterval(quizTimerInterval);
}

function updateTimer() {
  const diffSec = Math.floor((Date.now() - quizStartTime) / 1000); // Sekunden ganzzahlig
  const minutes = String(Math.floor(diffSec / 60)).padStart(2, '0');
  const seconds = String(diffSec % 60).padStart(2, '0');
  document.getElementById('quiz-timer').textContent = `${minutes}:${seconds}`;
}

// --- Counter aktualisieren ---
function updateQuizStatus() {
  document.getElementById('quiz-counter').textContent = `${correctCount} / ${totalShown} Richtig`;
}

function cancelImageLoads() {
  // Version hochzählen → alle alten Loads werden invalid
  currentDetailLoadToken++;

  if (detailPreloadImg) {
    detailPreloadImg.onload = null;
    detailPreloadImg.onerror = null;
    detailPreloadImg.src = ""; // Download abbrechen[web:31]
    detailPreloadImg = null;
    detailPreloadUrl = null;
  }
}

function onPreviewClick() {
  // Fall A: Detailbild ist schon sichtbar → zurück zur Vorschau
  if (showingDetail && isDetailLoaded) {
    showingDetail = false;
    imageEl.classList.remove("detail");
    imageEl.classList.add("preview");
    imageEl.src = currentItem.url_vorschau;
    return;
  }

  // Fall B: Detailbild wird gerade geladen → IGNORIEREN
  if (isDetailLoading && !isDetailLoaded) {
    return; // nochmaliges Klicken macht nichts
  }

  // Fall C: Detail wurde noch nicht geladen → Ladevorgang starten
  if (!isDetailLoaded) {
    isDetailLoading = true;
    loadDetailForCurrentItem();
  }
}

function loadDetailForCurrentItem() {
  if (!currentItem || !currentItem.url_detail) return;

  const img = new Image();
  img.onload = function () {
    isDetailLoading = false;
    isDetailLoaded  = true;

    showingDetail = true;
    imageEl.classList.remove("preview");
    imageEl.classList.add("detail");
    imageEl.src = img.src;
  };
  img.onerror = function () {
    isDetailLoading = false;
    // Fehlerbehandlung
  };
  img.src = currentItem.url_detail;
}

function setLicenseTextWithLink(licenseTextDiv, rawText) {
  let text = rawText || 'Kein Lizenzhinweis vorhanden.';

  // Alle ungewöhnlichen Bindestriche in normale Minuszeichen umwandeln
  text = text.replace(/[\u2010-\u2015]/g, '-');

  // Jetzt nach der normalisierten Schreibweise suchen
  const re = /CC BY-NC-SA 4\.0/;

  if (re.test(text)) {
    const linked = text.replace(
      re,
      '<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 4.0</a>'
    );
    licenseTextDiv.innerHTML = linked;
  } else {
    licenseTextDiv.textContent = text;
  }
}

function setFeaturesText(featuresTextDiv, answerItems) {
  if (!featuresTextDiv) return;

  if (!Array.isArray(answerItems) || answerItems.length === 0) {
    featuresTextDiv.innerHTML = 'Keine Merkmale vorhanden.';
    return;
  }

  const introHtml = `
    <div class="features-intro">
      Die folgenden Merkmale sowie der Gesamteindruck können bei der Bestimmung helfen.
    </div>
  `;

  const entriesHtml = answerItems.map(item => {
    const trivialName =
      Array.isArray(item.trivialname) && item.trivialname.length
        ? item.trivialname[0]
        : item.scientific_name;

    const rawTip = item.tipp || 'Keine Merkmale hinterlegt.';

    const formattedTip = String(rawTip)
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean)
      .join('<br>');

    return `
      <div class="feature-entry">
        <div class="feature-name">${trivialName}:</div>
        <div class="feature-tip">${formattedTip}</div>
      </div>
    `;
  }).join('');

  featuresTextDiv.innerHTML = introHtml + entriesHtml;
}


function stopAllAudio() {
  document.querySelectorAll('audio').forEach(function (audio) {
    audio.pause();
    audio.currentTime = 0;
  });
}

// Audio-Element pro Frage neu bauen
function createAudioElement(src) {
  const audioWrapper = document.getElementById('audio-wrapper');
  if (!audioWrapper) return;

  audioWrapper.innerHTML = '';

  const audioEl = document.createElement('audio');
  audioEl.controls = true;
  audioEl.preload = 'auto';
  audioEl.src = src;

  audioWrapper.appendChild(audioEl);

  // Erste Audio: nur Controls anzeigen, nicht automatisch starten
  if (audioPlayCountInRound === 0) {
    audioPlayCountInRound++;
    return;
  }

  // Ab der zweiten Audio versuchen wir autoplay
  audioPlayCountInRound++;

  const playPromise = audioEl.play();
  if (playPromise !== undefined) {
    playPromise.catch(err => {
      // Falls der Browser Autoplay blockt, tun wir einfach nichts,
      // dann bleibt der Play-Button sichtbar.
      console.warn('Autoplay blockiert:', err);
    });
  }
}


let nextAudioObj = new Audio();
nextAudioObj.preload = 'auto';
let isLoadingNext = false;

let preloadInFlight = null;

// Preload: nutzt NUR shuffledPhotos[photoIndex], kein nextImage()
async function preloadNextQuestion() {
  if (preloadInFlight) return preloadInFlight;   // laufenden Preload wiederverwenden

  preloadInFlight = (async () => {
    const upcoming = shuffledPhotos[photoIndex] || null;
    if (!upcoming) {
      nextItem = null;
      nextImageObj = null;
      nextAudioObj = null;
      nextDistractors = null;
      return;
    }

    nextItem = upcoming;
    nextImageObj = null;
    nextAudioObj = null;
    nextDistractors = null;

    if (upcoming.filetype === 'audio') {
      nextAudioObj = new Audio();
      nextAudioObj.preload = 'auto';
      nextAudioObj.src = upcoming.url_vorschau;
    } else {
      nextImageObj = new Image();
      nextImageObj.src = upcoming.url_vorschau;
    }

    nextDistractors = await fetchDistractorsFromDB(upcoming);
  })();

  try {
    await preloadInFlight;
  } finally {
    preloadInFlight = null;
  }
}


// --- Nächstes Bild ---
async function loadNextImage() {
  console.log(">>> loadNextImage START", {
    shownCount,
    totalShown,
    quizLength,
    photoIndex,
    nextItem: !!nextItem
  });
  if (isLoadingNext) return;    // verhindert parallel laufende Aufrufe
  isLoadingNext = true;

  try {
    // Quiz ggf. schon fertig
    if (answeredCount >= quizLength) {
      console.log("loadNextImage called but quiz already finished");
      endQuiz();
      return;
    }

    // 🔄 Immer zuerst zurück in den Vorschau-Modus
    isDetailLoading = false;
    isDetailLoaded  = false;
    cancelImageLoads();
    showingDetail = false;

    // Elemente holen
    const imageEl        = document.getElementById('species-image');
    const audioWrapper   = document.getElementById('audio-wrapper');
    const licenseTextDiv = document.getElementById('license-text');
    const licenseToggleBtn = document.getElementById('license-toggle');
    const featuresTextDiv   = document.getElementById('features-text');
    const featuresToggleBtn = document.getElementById('features-toggle');
    const imageToggleHint = document.getElementById("image-toggle-hint");

    if (imageToggleHint) {
      imageToggleHint.style.display = "none";  // Default: aus
    }

    // Lizenzhinweis immer einklappen
    licenseTextDiv.style.display = 'none';
    featuresTextDiv.style.display = 'none';
    if (licenseToggleBtn) {
      licenseToggleBtn.setAttribute('aria-expanded', 'false');
    }
    if (featuresToggleBtn) featuresToggleBtn.setAttribute('aria-expanded', 'false');

    // Audio stoppen, bevor wir etwas Neues anzeigen
    stopAllAudio();

    // Bild-Styles zurücksetzen
    imageEl.className = "preview";
    imageEl.style.width = "";
    imageEl.style.height = "";
    imageEl.style.objectFit = "";
    imageEl.style.transform = "translate(0,0)";

    // Falls noch nichts vorgeladen wurde: auf Preload warten
    if (!nextItem) {
      await preloadNextQuestion();
    }

    // Nächstes Item bestimmen
    let itemToUse = nextItem || shuffledPhotos[photoIndex] || null;
    if (!itemToUse) {
      console.error("Kein weiteres Item mehr", {
        photoIndex,
        length: shuffledPhotos.length,
        answeredCount,
        quizLength
      });
      endQuiz();
      return;
    }

    currentItem = itemToUse;
    nextItem = null;
    console.log('PRELOAD/FALLBACK currentItem', currentItem);

    shownCount++;
    totalShown++;
    // Index jetzt wirklich verbrauchen
    photoIndex++;

    resetUI();

    // Statistik-Update
    const id = currentItem.id;
    if (!stats[id]) stats[id] = 0;
    stats[id]++;

    // Erst alles ausblenden
    imageEl.style.display = 'none';
    audioWrapper.style.display = 'none';

    // Je nach filetype
    if (currentItem.filetype === 'audio') {
      // Platzhalter-Bild
      imageEl.src = `${R2_BASE_URL_VORSCHAU}/fqvorschau/Icons/audio_platzhalter.webp`;
      imageEl.style.display = 'block';

      // Audio-Player neu erzeugen
      createAudioElement(currentItem.url_vorschau);
      audioWrapper.style.display = 'block';

      if (imageToggleHint) {
        imageToggleHint.style.display = "none";
      }
    } else {
      audioWrapper.style.display = 'none';

      if (nextImageObj && nextImageObj.src === currentItem.url_vorschau) {
        // vorgeladenes Bild verwenden
        imageEl.src = nextImageObj.src;
        imageEl.style.display = 'block';
      } else {
        // regulär rendern
        renderImage(currentItem);
      }

      if (imageToggleHint) {
        imageToggleHint.style.display = "block";
      }
    }

    questionAreaEl.style.display = 'block';

    document.getElementById('photo-id').textContent =
      currentItem.id_nummer ? `# ${currentItem.id_nummer}` : '';

    document.getElementById('photo-credit').textContent =
      currentItem.author ? `© ${currentItem.author}` : '';

    setLicenseTextWithLink(licenseTextDiv, currentItem.Lizenz);

    // Distraktoren aus dem Preload nutzen (Fallback: live holen)
    const distractors = nextDistractors || await fetchDistractorsFromDB(currentItem);
    await buildAnswerUIWithGivenDistractors(currentItem, distractors);
    updateQuizStatus();

    // Fokus für Texteingabe
    if (selectedAnswerMode === "text" && window.innerWidth > MOBILE_MAX_WIDTH) {
      setTimeout(focusAnswer, 0);
    }

    console.log(">>> loadNextImage END", {
      shownCount,
      totalShown,
      quizLength,
      photoIndex,
      nextItem: !!nextItem
    });

    // Nächste Frage im Hintergrund vorladen
    await preloadNextQuestion();

  } finally {
    isLoadingNext = false;
  }
}






// --- Quiz beenden ---
function endQuiz() {
  stopAllAudio();
  clearInterval(quizTimerInterval);
  showQuizSummary();
  document.getElementById("abort-button").style.display = "none";
}

function showQuizSummary() {
  quizEl.style.display = "none";
  document.getElementById("quiz-status").style.display = "none";

  const durationSec = Math.floor((Date.now() - quizStartTime) / 1000);
  const minutes = Math.floor(durationSec / 60);
  const seconds = durationSec % 60;

  // ⭐ Spruch oben je nach Quote
  const rate = (correctCount / totalShown) * 100;
  let quote = "";

  if (rate === 100) quote = "Glanzleistung!";
  else if (rate >= 80) quote = "Großartig, da hat nicht viel gefehlt!";
  else if (rate >= 50) quote = "Du scheinst dich schon ganz gut auszukennen, probier's doch gleich nochmal!";
  else if (rate >= 25) quote = "Ein solides Ergebnis, aber kannst du das noch toppen?";
  else quote = "Aller Anfang ist schwer, aber Übung macht den Meister!";

  document.getElementById("summary-quote").textContent = quote;

  // ✅ Satz mit Anzahl richtig
  document.getElementById("summary-count").textContent =
    `Du hast ${correctCount} von ${answeredCount} Tieren richtig bestimmt!`;

  // ✅ Dauer mit Leerzeichen
  document.getElementById("summary-time").textContent =
    `Dauer: ${minutes}:${String(seconds).padStart(2,"0")} Minuten`;

  // Summary anzeigen
  document.getElementById("quiz-summary").style.display = "flex";
}

function hideQuizSummary() {
  const summary = document.getElementById("quiz-summary");
  if (summary) summary.style.display = "none";
}
